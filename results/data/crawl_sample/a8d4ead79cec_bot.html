6528332144233852","width":2500,"height":1667,"file_size":713271,"file_type":"jpeg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"is_placeholder":false,"has_audio_track":null,"duration":null,"url":null,"url_id":null,"url_thumb":null,"url_type":null,"created_at":"2024-03-16 23:44:11.258803","updated_at":"2024-03-16 23:44:11.258803"},"thumb_meta":[],"media":[{"id":32624781,"name":"NF_220609_0071.jpeg","hash":"A1679846306749916528332144233852","width":2500,"height":1667,"file_size":713271,"file_type":"jpeg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"in_use":true,"created_at":"2024-03-16T23:44:11.258803Z","updated_at":"2024-03-16T23:44:11.258803Z"}],"tags":[],"access_level":"public"},"V1517637689":{"id":"V1517637689","title":"Info Konstellationen","purl":"info-konstellationen","page_type":"page","content":"\u003cdiv style=\"text-align: right\">\u003ca class=\"icon-link\" href=\"#\" rel=\"close-overlay\">\u003ctext-icon icon=\"close\">\u003c/text-icon>\u003c/a>\u003c/div>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe landscape that surrounds us is never untouched. We have built on it, dug it up, planted it, flooded it. In everyday life, we often overlook the impact of our actions on it, and how every place bears traces of those who have lived, worked and dreamed here.\u003cbr />\u003cbr />Between trees and concrete, between paths and meadows, fragments from different times meet. Structures that were once created for other purposes – curious, provisional, monumental, or almost reclaimed by nature. In newly created, temporary constellations, permanence and transience, intention and coincidence, design and overgrowth intertwine. They raise questions about our relationship with nature. How do we shape our environment? And how does it shape us?\u003cbr />\n\u003cbr />\n\u003chr />\n\n\n\n\n\n\n\n\n\n\n\n\u003cbr />\nThe work was created as part of the final project at the Ostkreuz School of Photography, Berlin, supervised by Ludwig Rauch.\u003cbr />\n\u003cbr />\nAll images are available as fine art inkjet prints in an edition of 5 copies.\u003cbr />\n\u003cbr />\nIn addition, a self-published \u003ca href=\"https://www.youtube.com/watch?v=ZPU9Xl0qVm4\" target=\"_blank\">book\u003c/a> was created as part of the work, with great support from designer Nikolaj Jaberg. The book is shortlisted for the \u003ca href=\"https://dummyaward.org/dummy-award-2026/\" target=\"_blank\">Dummy Award 2026\u003c/a> and will be shown in different countries around the world at photo festivals and other events. Some of the 50 copies are still available.\u003cbr />\u003cbr />\nIf you are interested in the book or a print, please feel free to \u003ca href=\"about\" rel=\"history\">contact me\u003c/a>!\u003cbr />","local_css":"[id=\"V1517637689\"].page {\n}\n\n[id=\"V1517637689\"] .page-content {\n\tborder-width: 0.1rem;\n\tborder-style: solid;\n\tbackground-color: #ffffff;\n\tbox-shadow: 0.3rem 0.3rem 1rem 0rem rgba(0,0,0,0);\n\tborder-color: rgba(0,0,0,.85);\n}\n\n[id=\"V1517637689\"] .page-layout {\n\talign-items: center;\n\tpadding-right: 8rem;\n\tpadding-left: 60rem;\n\tpadding-top: 11.0rem;\n}","display":false,"stack":false,"pin":false,"overlay":true,"password_enabled":false,"page_count":0,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{"closeOnClickout":true,"closeOnNavigate":false,"animateOnOpen":{"fade":true,"speed":0.1,"slideAmount":50,"slideDirection":"default","wipeShape":"default","easing":"ease-in","scaleAmount":3,"rotateAmount":0},"animateOnClose":{"fade":true,"speed":0.1,"slideAmount":0,"slideDirection":"default","wipeShape":"default","easing":"ease-out","scaleAmount":-3,"rotateAmount":0},"openOnLoad":false,"closeOthersOnOpen":false},"thumb_media_id":32639314,"thumbnail":{"id":32639314,"master_muid":14536060,"name":"Praedikow_015_NF_211209_0084.jpg","hash":"B1680635152522139360477363162492","width":2500,"height":1667,"file_size":925480,"file_type":" s am schönsten ist","purl":"info-wo's-am-schönsten-ist-1","page_type":"page","content":"\u003cdiv style=\"text-align: right\">\u003ca class=\"icon-link\" href=\"#\" rel=\"close-overlay\">\u003ctext-icon icon=\"close\">\u003c/text-icon>\u003c/a>\u003c/div>\n\n\n\n\n\n\n\n\n\n\n\n\nAfter a few years in Berlin, my view of Biberach in southern Germany, where I grew up, has gradually changed: things that I always considered normal seem much more bizarre to me with a bit of distance. At the same time, I have become increasingly aware of how much I miss the familiar landscape and tranquillity of the area. \u003cbr />\n\u003cbr />\nThe approach of exploring this ambivalent feeling photographically has brought me back to it, allowing me to get to know what seems so familiar in a new way.\u003cbr />\n\u003cbr />\n\u003chr />\u003cbr />\nFrom November 2025 until February 2026, twelve pictures from this series were published in the German Newspaper \u003ca href=\"https://taz.de/\" target=\"_blank\">taz\u003c/a> within a photo column.","local_css":"[id=\"L2265689154\"].page {\n}\n\n[id=\"L2265689154\"] .page-content {\n\tborder-width: 0.1rem;\n\tborder-color: rgba(0,0,0,.85);\n\tborder-style: solid;\n\tbackground-color: #ffffff;\n}\n\n[id=\"L2265689154\"] .page-layout {\n\tpadding: 14.3rem;\n\tpadding-right: 8rem;\n\tpadding-bottom: 0rem;\n\tpadding-left: 65rem;\n\tpadding-top: 16rem;\n}","display":false,"stack":false,"pin":false,"overlay":true,"password_enabled":false,"page_count":null,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{"closeOnClickout":true,"closeOnNavigate":false,"animateOnOpen":{"fade":true,"speed":0.1,"slideAmount":50,"slideDirection":"default","wipeShape":"default","easing":"ease-in","scaleAmount":3,"rotateAmount":0},"animateOnClose":{"fade":true,"speed":0.1,"slideAmount":0,"slideDirection":"default","wipeShape":"default","easing":"ease-out","scaleAmount":-3,"rotateAmount":0},"openOnLoad":false,"closeOthers anu Gruber, Attila Hartwig, Nancy Jesse, Yvonne Most, Justus Lemm, Valentina Troendle, Theresa Wißmann, Heike Zappe\u003cbr />\n\u003cbr />\nThe book was edited by Johannes Staemmler and financed by the Förderverein der Brandenburgischen Technischen Universität Cottbus-Senftenberg.\u003cbr />","local_css":"[id=\"Y0358515982\"].page {\n}\n\n[id=\"Y0358515982\"] .page-content {\n\tborder-width: 0.1rem;\n\tborder-color: rgba(0,0,0,.85);\n\tborder-style: solid;\n\tbackground-color: #ffffff;\n}\n\n[id=\"Y0358515982\"] .page-layout {\n\tpadding: 14.3rem;\n\tpadding-right: 8rem;\n\tpadding-bottom: 0rem;\n\tpadding-left: 65rem;\n\tpadding-top: 16rem;\n}","display":false,"stack":false,"pin":false,"overlay":true,"password_enabled":false,"page_count":0,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{"closeOnClickout":true,"closeOnNavigate":false,"animateOnOpen":{"fade":true,"speed":0.1,"slideAmount":50,"slideDirection":"default","wipeShape":"default","easing":"ease-in","scaleAmount":3,"rotateAmount":0},"animateOnClose":{"fade":true,"speed":0.1,"slideAmount":0,"slideDirection":"default","wipeShape":"default","easing":"ease-out","scaleAmount":-3,"rotateAmount":0},"openOnLoad":false},"thumb_media_id":32639314,"thumbnail":{"id":32639314,"master_muid":14536060,"name":"Praedikow_015_NF_211209_0084.jpg","hash":"B1680635152522139360477363162492","width":2500,"height":1667,"file_size":925480,"file_type":"jpg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"is_placeholder":false,"has_audio_track":null,"duration":null,"url":null,"url_id":null,"url_thumb":null,"url_type":null,"created_at":"2024-03-17 11:36:54.755049","updated_at":"2024-03-17 11:36:54.755049"},"thumb_meta":{"hide_from_index":true},"media":[{"id":32639314,"name":"Praedikow_015_NF_211209_0084.jpg","hash":"B1680635152522139360477363162492","width":2500,"height":1667,"file_size":925480,"file_type":"jpg","mime_type":"image/jpeg","is_image":true,"is_video":false,"is_url":false,"in_use":true,"created_at":"2024-03-17T11:36:54.755049Z","updated_at":"2024-03-17T11:36:54.755049Z"}],"tags":[],"access_level":"public"},"S1660038422":{"id":"S1660038422","title":"Info slightly off","purl":"info-slightly-off","page_type":"page","content":"\u003cdiv style=\"text-align: right\">\u003ca class=\"icon-link\" href=\"#\" rel=\"close-overlay\">\u003ctext-icon icon=\"close\">\u003c/text-icon>\u003c/a>\u003c/div>\n\nI moved to Berlin during the pandemic in 2020, not knowing many people or the city itself, and not knowing what I wanted to do with my life. By taking walks almost every day I was able to get some variety and to explore the city – also photographically. \n\n\u003cbr />\u003cbr />\nMy eye is always caught by situations in the city that irritate me in some way. They are usually temporary situations that often show traces of human behaviour, little glitches in the system.\n\n\u003cbr />\u003cbr />\nSo far this practice is helping me to create my own universe and to develop and understand my thoughts. It allows me to still find comfort in this city, even when I’m overwhelmed by it sometimes. \n\n\u003cbr />\u003cbr />\nBy exploring the city, I have often found out more about myself.","local_css":"[id=\"S1660038422\"].page {\n}\n\n[id=\"S1660038422\"] .page-content {\n\tborder-width: 0.1rem;\n\tborder-color: rgba(0,0,0,.85);\n\tborder-style: solid;\n\tbackground-color: #ffffff;\n}\n\n[id=\"S1660038422\"] .page-layout {\n\tpadding: 14.3rem;\n\tpadding-right: 8rem;\n\tpadding-bottom: 0rem;\n\tpadding-left: 65rem;\n\tpadding-top: 16rem;\n}","display":false,"stack":false,"pin":false,"overlay":true,"password_enabled":false,"page_count":null,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{"closeOnClickout":true,"closeOnNavigate":false,"animateOnOpen":{"fade":true,"speed":0.1,"slideAmount":50,"slideDirection":"default","wipeShape":"default","easing":"ease-in","scaleAmount":3,"rota
