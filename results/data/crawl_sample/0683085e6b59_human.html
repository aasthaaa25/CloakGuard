    <div id="main404">
        <h1>Oh oh, Page not found!</h1>
        <h2>The link you clicked may be broken or the page has been removed or does not exist.<br>

    <!-- Bootstrap Core JavaScript -->

    <script>


        $(document).ready(function() {

            // Closes the Responsive Menu on Menu Item Click
            $('.navbar-collapse ul li a:not(#dropNav)').click(function() {
                $('.navbar-toggle:visible').click();
            });

            // Smooth scrolling for anchor links
            $('a[href*="#"]:not([href="#"])').click(function() {
                if (location.pathname.replace(/^\//, '') == this.pathname.replace(/^\//, '') && location.hostname == this.hostname) {
                    var target = $(this.hash);
                    target = target.length ? target : $('[name=' + this.hash.slice(1) + ']');
                    if (target.length) {
                    $('html, body').animate({
                        scrollTop: target.offset().top
                    }, 1000);
                    return false;
                    }
                }
            });


            // Initiate Scrollspy (update links in a navigation list based on scroll position)
            $('body').scrollspy({target: ".navbar-default", offset: 50});


        });

    </script>
