services:
  cloakguard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ORIGIN_SERVER_URL: ${ORIGIN_SERVER_URL:?Set the URL of your authorized origin}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  demo-origin:
    profiles: ["demo"]
    image: python:3.11-slim
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/demo"]
    volumes:
      - ./smoke-origin:/demo:ro
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
