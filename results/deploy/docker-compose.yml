services:
  cloakguard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ORIGIN_SERVER_URL: ${ORIGIN_SERVER_URL:?Set the URL of your authorized origin}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
